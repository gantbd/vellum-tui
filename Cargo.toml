[workspace]
resolver = "3"
members = [".", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/vellum-tui"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "vellum-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
description = "Composable Ratatui presentation and standalone terminal application for Vellum"

[lib]
name = "vellum_tui"

[dependencies]
vellum-editor = { version = "=0.1.0", path = "../vellum/host/vellum-editor" }
vellum-sdk-client = { version = "=0.1.0", path = "../vellum/sdk/client" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
serde_json = "=1.0.151"
vellum-adapter-local-fs = { version = "=0.1.0", path = "../vellum/adapters/local-fs" }
vellum-adapter-annotation-json = { version = "=0.1.0", path = "../vellum/adapters/annotation-json" }
vellum-adapter-unicode-icu = { version = "=0.1.0", path = "../vellum/adapters/unicode-icu" }
vellum-editor = { version = "=0.1.0", path = "../vellum/host/vellum-editor", features = ["native-unicode"] }

[lints]
workspace = true
