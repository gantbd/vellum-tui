[workspace]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/vellum-tui"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "vellum-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
description = "Composable Ratatui presentation and standalone terminal application for Vellum"

[lib]
name = "vellum_tui"

[[bin]]
name = "vellum-tui"
path = "src/main.rs"
required-features = ["standalone-macos"]

[features]
default = []
standalone-macos = [
    "dep:vellum-clipboard-macos",
    "dep:vellum-adapter-local-fs",
    "dep:vellum-adapter-annotation-json",
    "dep:vellum-adapter-unicode-icu",
    "dep:vellum-engine",
    "dep:vellum-adapter-local-authentication",
    "vellum-editor/native-unicode",
]

[dependencies]
vellum-clipboard-macos = { version = "=0.1.0", path = "../vellum/applications/vellum-clipboard-macos", optional = true }
vellum-adapter-local-fs = { version = "=0.1.0", path = "../vellum/adapters/local-fs", optional = true }
vellum-adapter-annotation-json = { version = "=0.1.0", path = "../vellum/adapters/annotation-json", optional = true }
vellum-adapter-unicode-icu = { version = "=0.1.0", path = "../vellum/adapters/unicode-icu", optional = true }
vellum-editor = { version = "=0.1.0", path = "../vellum/host/vellum-editor" }
vellum-engine = { version = "=0.1.0", path = "../vellum/engine/vellum-engine", optional = true }
vellum-sdk-client = { version = "=0.1.0", path = "../vellum/sdk/client" }
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../vellum/adapters/local-authentication", optional = true }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
serde_json = "=1.0.151"

[lints]
workspace = true
